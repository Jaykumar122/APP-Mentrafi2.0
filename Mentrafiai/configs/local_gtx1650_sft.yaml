model:
  assistant_token_id: 5
  bos_token_id: 1
  context_length: 1024
  d_ff: 2240
  d_model: 768
  dropout: 0.0
  eos_token_id: 2
  init_std: 0.02
  norm_eps: 1.0e-06
  num_heads: 12
  num_kv_heads: 4
  num_layers: 16
  pad_token_id: 0
  rope_theta: 10000.0
  unk_token_id: 3
  user_token_id: 4
  vocab_size: 16000
training:
  batch_size: 1
  data_dir: data/llm120_sft
  eval_batches: 300
  eval_interval: 46
  grad_clip: 1.0
  gradient_accumulation_steps: 32
  gradient_checkpointing: true
  learning_rate: 5.0e-05
  max_overflow_retries: 8
  max_steps: 230
  min_lr: 5.0e-06
  output_dir: checkpoints/llm120_sft_v2
  precision: auto
  save_interval: 46
  seed: 42
  stage: sft
  tokenizer: tokenizer/tokenizer_v2.model
  warmup_steps: 20
  weight_decay: 0.1
