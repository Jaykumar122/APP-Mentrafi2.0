# MentraFiAI Pretrain Recovery Configuration
# Goal: Break through the 3.60 val_loss plateau and reach < 3.00
#
# STRATEGY:
# 1. Increase model capacity (14->16 layers, 768->864 dim) = ~150M params
# 2. Extend training to 2 full epochs (current: 0.69 epochs)
# 3. Adjust LR schedule to maintain higher LR longer
# 4. Add learning rate warmup restart to escape plateau

pretrain:
  # Training dynamics — EXTENDED
  batch_size: 1
  gradient_accumulation_steps: 128
  max_steps: 16800                    # 2x epochs: 2.2B tokens / 131k tok/step = 16,800 steps

  # Learning rate — HIGHER and LONGER warmup
  learning_rate: 5.0e-4                # Increased from 3e-4 (larger model needs higher LR)
  min_learning_rate: 5.0e-5            # Higher floor (10x ratio maintained)
  warmup_steps: 840                    # 5% of max_steps
  weight_decay: 0.1
  max_grad_norm: 1.0

  # Precision
  use_mixed_precision: false
  gradient_checkpointing: false

  # Evaluation — MORE FREQUENT to catch improvements
  eval_interval: 100                   # Every 100 steps instead of 200
  eval_iters: 100
  log_interval: 10

  # Checkpoints
  save_interval: 27
  checkpoint_dir: "./checkpoints/pretrain_v2_recovery"
  keep_last_n_checkpoints: 3

  # Initialize from current checkpoint (warm start)
  init_from: "./checkpoints/pretrain_v2/latest.pt"
  resume_from: null

  # Data
  train_data: "./data/processed/corpus_v2/train.bin"
  val_data: "./data/processed/corpus_v2/val.bin"

monitoring:
  heartbeat_file: "./training_heartbeat_recovery.txt"
  heartbeat_interval: 10
  auto_save_on_interrupt: true

hardware:
  device: "cuda"
  compile: false
  num_workers: 2
  pin_memory: true
